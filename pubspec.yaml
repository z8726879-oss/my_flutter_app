name: my_new_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
   sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.3
  socket_io_client: ^2.0.3
  cupertino_icons: ^1.0.8
  audioplayers: ^5.2.1
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # أضفنا هذه المكتبة هنا
  flutter_launcher_icons: ^0.13.1

# إعدادات الأيقونة الجديدة (تأكد من وجود صورة بهذا المسار)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png" 
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/notification-sound-for-whatsapp.mp3
