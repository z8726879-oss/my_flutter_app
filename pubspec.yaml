name: my_new_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.3
  
  # حزمة السوكيت المستقرة الخاصة بك
  socket_io_client: ^3.1.6
  cupertino_icons: ^1.0.8

  # حزم الفايربيز المستقرة المتوافقة مع كود الإشعارات والصوت الخاص بك
  firebase_core: 2.32.0
  firebase_messaging: 14.7.10

  # النسخ المستقرة لتشغيل الأصوات والإشعارات المحلية
  audioplayers: 5.2.1
  # 🌟 تم التعديل هنا: تحديث الإصدار إلى 17.0.0 لحل مشكلة تعارض مترجم الجافا سحابياً
  flutter_local_notifications: ^17.0.0
  intl: ^0.18.1
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutterfire_cli: ^1.4.0

# إعدادات الأيقونة الخاصة بالتطبيق
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/notification_sound_for_whatsapp.mp3
    - .env # 