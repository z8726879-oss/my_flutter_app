name: Build All (Android & iOS)

on:
  push:
    branches:
      - main

jobs:
  android-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.0'

      - name: Build Android APK
        run: |
          flutter pub get
          flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  ios-job:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.0'

      # 1️⃣ خطوة التدمير: إزالة حزم الفايربيز من الكاش تماماً قبل البدء بالـ iOS لمنع الخطأ المعجمي
      - name: Remove Firebase packages for iOS Build
        run: |
          flutter pub remove firebase_messaging firebase_core --offline || true

      # 2️⃣ تنظيف الكاش والبودات القديمة لضمان عدم بقاء أي ملف ترويسة معزول
      - name: Clean Pods Cache
        run: |
          flutter pub get
          cd ios
          pod deintegrate
          pod cache clean --all
          cd ..

      # 3️⃣ خطوة البناء الآمنة والخالية تماماً من حزم Firebase على الـ iOS
      - name: Build iOS Application
        run: |
          flutter build ios --simulator --no-codesign --debug

      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-simulator
          path: build/ios/iphonesimulator/*.app
