name: Build All (Android & iOS)

on:
  push:
    branches:
      - main

jobs:
  android-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.0'

      - name: Build Android APK
        run: |
          flutter pub get
          flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  ios-job:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.0'

      # 1️⃣ تنظيف الكاش وتحميل الحزم من جديد في خادم الماك
      - name: Install and Clean Pods
        run: |
          flutter pub get
          cd ios
          pod deintegrate
          pod cache clean --all
          pod install || true
          cd ..

      # 2️⃣ 🌟 خطوة التدمير الحاسمة: حقن خيار الأمان إجبارياً في جميع ملفات الإعدادات والبودات قبل البناء
      - name: Force Fix Non-Modular Headers for Firebase
        run: |
          echo "CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES = YES" >> ios/Pods/Target\ Support\ Files/Pods-Runner/Pods-Runner.debug.xcconfig
          echo "CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES = YES" >> ios/Pods/Target\ Support\ Files/Pods-Runner/Pods-Runner.release.xcconfig
          if [ -d "ios/Pods/Target Support Files/firebase_messaging" ]; then
            echo "CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES = YES" >> "ios/Pods/Target Support Files/firebase_messaging/firebase_messaging.xcconfig"
          fi

      # 3️⃣ البناء النهائي المستقر
      - name: Build iOS Application
        run: |
          flutter build ios --simulator --no-codesign --debug

      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-simulator
          path: build/ios/iphonesimulator/*.app
