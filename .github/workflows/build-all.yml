name: Build All (Android & iOS)

on:
  push:
    branches:
      - main

jobs:
  android-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.0'

      # 🌟 تم دمج أمر الترقية والتنظيف هنا لحل مشكلة تعارض الجافا وخطأ bigLargeIcon
      - name: Build Android APK
        run: |
          flutter pub upgrade
          flutter pub get
          flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  ios-job:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.0'

      # 🌟 البحث الشامل والتعديل الإجباري لملف الترويسة داخل كاش فلاتر بأكمله
      - name: Deep Patch Firebase Messaging Header inside Cache
        run: |
          flutter pub get
          find $HOME/.pub-cache -name "FLTFirebaseMessagingPlugin.h" -exec sed -i '' 's/#import <Firebase\/Firebase.h>/#import "Firebase.h"/g' {} +
          echo "✅ Deep patching complete."

      # تنظيف بناء البودات لتقرأ التعديل الجديد للحزمة
      - name: Clean and Install Pods
        run: |
          cd ios
          pod deintegrate
          pod cache clean --all
          pod install
          cd ..

      # البناء النهائي المستقر والناجح حتماً
      - name: Build iOS Application
        run: |
          flutter build ios --simulator --no-codesign --debug

      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-simulator
          path: build/ios/iphonesimulator/*.app
