name: Build All (Android & iOS)
on:
  push:
    branches: [ main ]

jobs:
  # مهمة بناء الأندرويد (تنتج ملف APK جاهز للهاتف)
  android-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.2'

      - name: Build Android APK
        run: |
          flutter pub get
         flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # مهمة بناء الـ iOS (تنتج ملف app للمحاكي السحابي)
  ios-job:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.2'

      - name: Reconstruct and Build iOS
        run: |
          flutter clean
          rm -rf ios
          flutter create . --platforms=ios
          flutter pub get
          # بناء للمحاكي لتجنب طلب حساب مطور أو توقيع رقمي
          flutter build ios --simulator --no-codesign

      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-simulator
          path: build/ios/iphonesimulator/*.app
