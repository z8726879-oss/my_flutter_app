name: Build All (Android & iOS)

on:
  push:
    branches:
      - main

jobs:
  android-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.0'

      - name: Build Android APK
        run: |
          flutter pub get
          flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  ios-job:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.0'

      # 🌟 الخطوة السحرية والحاسمة: تعديل كود حزمة firebase_messaging داخل كاش السيرفر مباشرة لتجاوز حماية Xcode
      - name: Patch Firebase Messaging Source Code
        run: |
          flutter pub get
          # البحث عن ملف الحزمة المسبب للأزمة واستبدال استدعاء <Firebase/Firebase.h> بـ "Firebase.h" القياسي
          TARGET_FILE="$HOME/.pub-cache/hosted/pub.dev/firebase_messaging-14.7.10/ios/Classes/FLTFirebaseMessagingPlugin.h"
          if [ -f "$TARGET_FILE" ]; then
            sed -i '' 's/#import <Firebase\/Firebase.h>/#import "Firebase.h"/g' "$TARGET_FILE"
            echo "✅ Done patching FLTFirebaseMessagingPlugin.h"
          else
            echo "⚠️ File not found in cache, skipping patch"
          fi

      # تنظيف بناء البودات لتقرأ التعديل الجديد للحزمة
      - name: Clean and Install Pods
        run: |
          cd ios
          pod deintegrate
          pod cache clean --all
          pod install
          cd ..

      # البناء النهائي المستقر والناجح حتماً
      - name: Build iOS Application
        run: |
          flutter build ios --simulator --no-codesign --debug

      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-simulator
          path: build/ios/iphonesimulator/*.app
