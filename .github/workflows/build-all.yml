  android-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17' # حافظنا على 17 لضمان الاستقرار

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.2'

      - name: Fix Gradle/Groovy Conflict
        run: |
          flutter pub get
          # هذا السطر مهم لتجاوز مشاكل التوافق في النسخ الحديثة
          flutter build apk --release --no-pub --dart-define=org.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
