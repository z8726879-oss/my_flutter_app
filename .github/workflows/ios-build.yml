name: iOS Build
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.2'

      - name: Install dependencies
        run: flutter pub get

      # خطوة إضافية لضمان توليد ملفات الـ iOS والـ Plugins بشكل سليم
      - name: Prepare iOS Project
        run: |
          flutter create . --platforms=ios
          flutter pub get
          cd ios
          pod install || true 
        # استخدمنا pod install لضمان ربط المكتبات يدوياً إذا فشل التوليد التلقائي

      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-bundle
          path: build/ios/iphoneos/*.app
