name: iOS Build
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.2'

      - name: Install dependencies
        run: flutter pub get

      - name: Build for Simulator (No Signing Required)
        # تعديل الأمر ليبني للمحاكي (iphonesimulator) بدلاً من الجهاز الحقيقي
        run: flutter build ios --sim-actual --no-codesign

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-bundle
          # المسار الجديد للملف الناتج للمحاكي
          path: build/ios/iphonesimulator/*.app
