name: iOS Build
on:
  push:
    branches: [ main ] # تأكد أن اسم الفرع عندك هو main

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.0' # يمكنك تغييرها لإصدارك أو تركها لجلب الأحدث

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-bundle
          # هذا المسار يبحث عن أي مجلد ينتهي بـ .app داخل مخرجات البناء
          path: build/ios/iphoneos/*.app
          if-no-files-found: error # سيعطيك تنبيهاً إذا لم يجد الملف
