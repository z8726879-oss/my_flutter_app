name: iOS Build
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.2'

      - name: Fix and Reconstruct iOS Project
        run: |
          flutter clean
          flutter pub get
          # حذف ملفات الإعدادات القديمة التي تسبب التعارض
          rm -rf ios/Flutter/Generated.xcconfig
          rm -rf ios/Flutter/ephemeral
          # إجبار فلاتر على إعادة إنشاء ملفات الربط (هذا هو الحل السحري)
          flutter create . --platforms=ios
          
      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-bundle
          path: build/ios/iphoneos/*.app
