name: iOS Build
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.2'

      - name: Fix Swift Packages Error
        run: |
          flutter clean
          flutter pub get
          # تعطيل ميزة Swift Package Manager مؤقتاً لضمان البناء التقليدي
          flutter config --no-native-assets
          # توليد ملفات الربط يدوياً
          flutter build ios --config-only --no-codesign

      - name: Build iOS App
        run: |
          # نستخدم هذا الأمر تحديداً لتجاوز فحص الحزم المفقودة في Xcode
          flutter build ios --release --no-codesign --cmd-switch="-skipPackagePluginResolution"

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-bundle
          path: build/ios/iphoneos/*.app
